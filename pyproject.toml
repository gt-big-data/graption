# uv workspace root. Not a package itself; `uv sync` installs every member.
[project]
name = "graption-workspace"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["graption-server", "graption-ml", "graption-language"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["server", "ml", "language"]

[tool.uv.sources]
graption-server = { workspace = true }
graption-ml = { workspace = true }
graption-language = { workspace = true }

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8", "jsonschema>=4.23"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["schemas", "server", "ml", "language"]
addopts = "--import-mode=importlib"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
