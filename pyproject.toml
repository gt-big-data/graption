# uv workspace root. Not a package itself; `uv sync` installs every member.
[project]
name = "graption-workspace"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["graption-server", "graption-ml", "graption-language"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["server", "ml", "language"]

[tool.uv.sources]
graption-server = { workspace = true }
graption-ml = { workspace = true }
graption-language = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "jsonschema>=4.23",
    "httpx>=0.28.1",
    "datamodel-code-generator>=0.83.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Descriptions are copied verbatim from the schema by datamodel-code-generator.
"server/app/events.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["schemas", "server", "ml", "language"]
addopts = "--import-mode=importlib"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
