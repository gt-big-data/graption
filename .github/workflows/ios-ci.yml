name: iOS CI

on:
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-ci.yml"

jobs:
  ios:
  # Use Xcode 27 instead of macos-latest because Graption's Xcode project
  # uses a newer project format that Xcode 26.6 cannot open.
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Graption iOS app
        run: |
          xcodebuild \
            -project apps/ios/Graption.xcodeproj \
            -scheme Graption \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            'EXCLUDED_ARCHS[sdk=iphonesimulator*]=x86_64' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test GraptionVision
        run: swift test --package-path apps/ios/Packages/GraptionVision

#mac-os latest or xcode-27 for the mac server to host and run the Github Actions Server on?
