name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "server/**"
      - "ml/**"
      - "language/**"
      - "schemas/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  # TODO: add a macOS job (own workflow, path-filtered to apps/ios/**; macOS minutes are expensive):
  #   xcodebuild -project apps/ios/Graption.xcodeproj -scheme Graption \
  #     -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
  #   plus `swift test` in each apps/ios/Packages/* once packages exist.
