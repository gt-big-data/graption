name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "server/**"
      - "ml/**"
      - "language/**"
      - "schemas/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  # TODO: add a macOS `swift test` job (path-filtered to apps/ios/**) once the iOS packages exist.
